name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, unit + integration tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U it -d it"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Unit tests with domain coverage
        run: |
          go test -race -count=1 -coverprofile=coverage-domain.out ./internal/domain/... ./internal/auth/... ./internal/httpx/...
          go tool cover -func=coverage-domain.out | tee coverage-domain.txt
      - name: Coverage gate (domain packages >= 70 %)
        run: |
          total=$(go tool cover -func=coverage-domain.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          {
            echo "## Test kapsamı"
            echo
            echo "| Paket | Kapsam |"
            echo "|---|---|"
            go test -cover ./internal/domain/... ./internal/auth/... ./internal/httpx/... | awk '/coverage:/ {print "| " $2 " | " $5 " |"}'
            echo "| **Toplam (domain + auth + httpx)** | **${total}%** |"
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit (t >= 70) ? 0 : 1 }' || { echo "coverage ${total}% < 70%"; exit 1; }

      - name: Integration tests (real PostgreSQL, -race)
        env:
          TEST_DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
        run: |
          go test -race -count=1 -v -coverpkg=./internal/... -coverprofile=coverage-integration.out ./internal/api/... | tee integration.log | grep -E '^(--- |PASS|FAIL|ok)'
          echo "Entegrasyon kapsamı: $(go tool cover -func=coverage-integration.out | awk '/^total:/ {print $3}')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage-domain.txt
            backend/coverage-*.out
            backend/integration.log

  frontend:
    name: Frontend (type check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Container images + end-to-end verify
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
          docker image ls | grep sogukzincir
      - name: Start stack (cold start must be healthy within 5 minutes)
        run: |
          start=$(date +%s)
          timeout 300 docker compose up -d --wait
          echo "Ayağa kalkma süresi: $(( $(date +%s) - start )) sn" >> "$GITHUB_STEP_SUMMARY"
      - name: make verify
        run: |
          docker compose --profile verify run --rm verify | tee verify.log
          { echo '## make verify'; echo '```'; sed -n '/^+----/,$p' verify.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
